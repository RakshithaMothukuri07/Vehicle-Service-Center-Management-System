spring.application.name=VehicleServiceCenter
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_service_center?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=VehicleServicePool

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata


spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50


management.endpoints.web.exposure.include=health,info,metrics,env,beans
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Vehicle Service Center
info.app.description=Vehicle Service Center Management System


app.stock.low-threshold=5
app.mechanic.max-active-jobs=3